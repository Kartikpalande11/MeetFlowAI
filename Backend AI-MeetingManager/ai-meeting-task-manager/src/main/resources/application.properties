spring.application.name=ai-meeting-task-manager

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/ai_meeting_task_manager
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# OpenRouter AI
ai.api.key=${OPENROUTER_API_KEY}
ai.api.url=https://openrouter.ai/api/v1/chat/completions
ai.model=nvidia/nemotron-3.5-lightning:free